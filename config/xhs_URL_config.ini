# 小紅書博主主頁作品監控清單 (每行一個博主主頁網址)
# 格式範例：
# https://www.xiaohongshu.com/user/profile/24位userid, 博主: 名稱
# ⚠️ 風控防護警示：
# 1. 強烈建議僅在 config.ini 的 [Cookie] 填寫小紅書測試小號 Cookie，切勿使用個人主力帳號！
# 2. 系統內建 461/471 人機驗證碼自動熔斷保護，觸發時會自動休眠 24 小時並發送釘釘告警。
# 3. 每日僅巡檢一次（09:00 觸發，隨機延遲 0~240 分鐘後才實際請求）。
# 4. 博主之間至少間隔 10 分鐘（隨機 10~15 分鐘）；同一博主的筆記之間至少 3 分鐘（隨機 3~5 分鐘）。

